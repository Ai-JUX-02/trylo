[package]
name = "trylo-pty"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "trylo-pty"
path = "src/main.rs"

[dependencies]
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 1
lto = true
codegen-units = 1
strip = true
