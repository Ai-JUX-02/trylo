<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YL</title>
<meta name="description" content="YL 的个人主页。一个大二学生，在独立做 Trylo Code。" />
<link rel="icon" type="image/svg+xml" href="../assets/trylo-icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d10;
    --text: #edf0f4;
    --text-soft: #b6bdc9;
    --muted: #7f8898;
    --accent: #dcc97e;
    --accent-strong: #f3e3a6;
    --line: #333947;
    --font-latin: "Space Grotesk", "Noto Sans SC", system-ui, sans-serif;
    --font-cn: "Noto Sans SC", system-ui, sans-serif;
    --font-serif: "Noto Serif SC", "Songti SC", serif;
    --font-mono: "IBM Plex Mono", "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-cn); line-height: 1.7;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 3px; }

  .stage { position: relative; height: 100svh; min-height: 560px; overflow: hidden; }
  #gl, .still { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .still { object-fit: cover; }
  [data-gl="off"] #gl { display: none; }
  [data-gl="on"] .still { display: none; }

  .scrim {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(101deg, rgba(8,10,13,.60) 0%, rgba(8,10,13,.32) 26%, rgba(8,10,13,.08) 48%, rgba(8,10,13,0) 66%);
  }
  .copy { text-shadow: 0 1px 28px rgba(6,8,11,.55), 0 1px 3px rgba(6,8,11,.40); }

  .copy {
    position: absolute; left: 0; right: 0; top: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 clamp(24px, 6vw, 84px); max-width: 780px;
  }
  .kicker {
    font-family: var(--font-cn); font-weight: 500; font-size: 12.5px;
    letter-spacing: .34em; color: var(--accent); margin-bottom: 22px;
  }
  .kicker .n { font-family: var(--font-mono); letter-spacing: .1em; }
  h1 {
    font-family: var(--font-latin); font-weight: 700;
    font-size: clamp(72px, 13vw, 164px); line-height: .86;
    letter-spacing: -.05em; color: var(--text);
  }
  .who {
    margin-top: 26px; font-family: var(--font-cn);
    font-size: clamp(15px, 1.9vw, 19px); font-weight: 400; line-height: 1.9;
    color: var(--text-soft); max-width: 24em;
  }
  .who b { font-family: var(--font-latin); font-weight: 700; color: var(--text); letter-spacing: -.01em; }
  .who .tent { color: var(--accent-strong); font-weight: 500; }
  body.serif .who {
    font-family: var(--font-serif); font-weight: 500;
    font-size: clamp(17px, 2.2vw, 22px); line-height: 1.95;
  }
  .acts { margin-top: 38px; display: flex; gap: 14px; flex-wrap: wrap; }
  .btn {
    font-family: var(--font-cn); font-weight: 500; font-size: 14.5px;
    letter-spacing: .05em; padding: 13px 24px;
    border-radius: 999px; border: 1px solid var(--line); color: var(--text);
    background: rgba(11,13,16,.35); backdrop-filter: blur(6px);
    transition: transform .18s, border-color .2s, color .2s, background .2s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-strong); }
  .btn-go { background: var(--accent); color: #0b0d10; border-color: var(--accent); font-weight: 500; }
  .btn-go:hover { background: var(--accent-strong); color: #0b0d10; transform: translateY(-1px); }

  .meta {
    position: absolute; left: clamp(24px, 6vw, 84px); right: clamp(24px, 6vw, 84px); bottom: 26px;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 18px;
    font-family: var(--font-cn); font-size: 12px; color: var(--muted); letter-spacing: .14em;
  }
  .hint { display: inline-flex; align-items: center; gap: 9px; }
  .hint i { width: 1px; height: 26px; background: linear-gradient(180deg, transparent, var(--accent)); display: block; }
  .snd {
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px;
    background: rgba(11,13,16,.5); color: var(--text-soft); cursor: pointer;
    font: inherit; letter-spacing: .08em;
  }
  .snd[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-strong); }

  .next {
    position: relative; border-top: 1px solid #1b1f26; padding: 96px clamp(24px, 6vw, 84px) 120px;
    background: linear-gradient(180deg, #0b0d10, #0c1015);
  }
  .next h2 { font-size: clamp(24px, 4vw, 40px); font-weight: 700; letter-spacing: -.02em; }
  .next p { margin-top: 14px; color: var(--text-soft); max-width: 46em; }
  .todo {
    margin-top: 26px; font-family: var(--font-cn); font-size: 12.5px; color: var(--muted);
    border-left: 2px solid var(--accent); padding-left: 14px;
  }

  @media (max-aspect-ratio: 1/1) {
    .copy { justify-content: flex-end; padding-bottom: 104px; }
    .scrim {
      background:
        linear-gradient(0deg, rgba(8,10,13,.92) 6%, rgba(8,10,13,.62) 34%, rgba(8,10,13,0) 62%);
    }
    h1 { font-size: clamp(48px, 16vw, 96px); }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .btn:hover { transform: none; }
  }
</style>
</head>
<body>

<section class="stage" id="top" data-gl="off">
  <canvas id="gl" aria-hidden="true"></canvas>
  <img class="still" src="assets/act1_gptridge/base.webp" alt="蓝调时刻的高山花岗岩刀背山脊，鞍部有一顶亮着暖光的帐篷，头顶是拉丝的流云" />
  <div class="scrim"></div>

  <div class="copy">
    <div class="kicker">第 <span class="n">1</span> 幕 · 山脊</div>
    <h1>YL</h1>
    <p class="who">一个大二学生，在独立做 <b>Trylo Code</b>。<br>别人都在山顶看日出，<span class="tent">我把帐篷搭在了那儿</span>。</p>
    <div class="acts">
      <a class="btn btn-go" href="#act2">上车 · 走完这一年</a>
      <a class="btn" href="#act2">直接看名片</a>
    </div>
  </div>

  <div class="meta">
    <span class="hint"><i></i>向下 · 走进这张照片</span>
    <button class="snd" id="snd" aria-pressed="false" type="button">声 · 关</button>
  </div>
</section>

<section class="next" id="act2">
  <h2>第 2 幕 · 车窗</h2>
  <p>还没接。这一段是坐在火车里往外看，窗外掠过的是这一年的四个真日子。</p>
  <div class="todo">待你定：旅程走几站（我建议 4 站）· 名片上叫什么 · GitHub 用户名 · 要不要头像</div>
</section>

<script>
(() => {
  const stage = document.getElementById('top');
  const cv = document.getElementById('gl');
  const SRC = {
    wide: ['assets/act1_gptridge/base.webp', 'assets/act1_gptridge/depth.png',
           'assets/act1_gptridge/edge.png', 0.60, 0.42],
    tall: ['assets/act1_gptridge/base.webp', 'assets/act1_gptridge/depth.png',
           'assets/act1_gptridge/edge.png', 0.67, 0.42]
  };
  const TENT = { wide: [0.6717, 0.4222], tall: [0.6717, 0.4222] };

  if (new URLSearchParams(location.search).get('f') === 'serif') document.body.classList.add('serif');

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const gl = reduced ? null : cv.getContext('webgl', { antialias: false, alpha: false });
  if (!gl) return;

  const VS = `attribute vec2 a; varying vec2 v;
    void main(){ v = a*0.5+0.5; gl_Position = vec4(a,0.,1.); }`;
  const FS = `#ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;   // 云位移是小数累加，mediump 在这里会跳格
    #else
    precision mediump float;
    #endif
    varying vec2 v;
    uniform sampler2D uI, uD, uE;
    uniform vec2 uSh, uOff, uTent, uPc;
    uniform float uZ, uAsp, uAspS, uT, uOn, uDrift, uHalf, uRot;
    const float E = 0.0006;
    void main(){
      // 照片四边形：屏幕坐标 -> 内图归一化坐标。窗口纵横比恒等于照片纵横比，
      // 所以不需要 cover——放大超出画面时天然就是裁切，几何严格一致，
      // 内容不会在白边里滑动（这是上一版台阶马赛克换来的教训）。
      vec2 rp = vec2((v.x - uPc.x) * uAspS, v.y - uPc.y);
      float cs = cos(uRot), sn = sin(uRot);
      rp = vec2(rp.x * cs - rp.y * sn, rp.x * sn + rp.y * cs);
      vec2 eh = vec2(uHalf * uAspS, uHalf / uAsp);
      vec2 pv = rp / (2.0 * eh) + 0.5;

      float bX = 0.030, bY = 0.030 * eh.x / eh.y;
      float aX = abs(pv.x - 0.5), aY = abs(pv.y - 0.5);
      float mPhoto = max(aX / 0.5, aY / 0.5);
      float mPrint = max(aX / (0.5 + bX), aY / (0.5 + bY));
      float inPhoto = 1.0 - smoothstep(0.994, 1.0, mPhoto);
      float inPrint = 1.0 - smoothstep(0.994, 1.0, mPrint);

      // 场景
      vec2 uv = (pv - 0.5) / uZ + 0.5 + uOff;
      uv.y = 1.0 - uv.y;
      float d = texture2D(uD, uv).r;
      vec2 tuv = uv + uSh * d;
      vec3 terr = texture2D(uI, clamp(tuv, E, 1.0 - E)).rgb;

      float bnd = texture2D(uE, vec2(clamp(uv.x, E, 1.0 - E), 0.5)).g;

      // 云窗贴着天际线收口，羽化尽量落在岩石那一侧；
      // su.y == uv.y 且不做任何纵向缩放，所以漂移为 0 时两层逐像素重合、边界天然隐形。
      float w = 1.0 - smoothstep(bnd - 0.006, bnd + 0.010, uv.y);
      vec2 su = vec2(fract(uv.x + uDrift), uv.y);
      vec3 cloud = texture2D(uI, su).rgb;

      float veil = (texture2D(uI, vec2(su.x, bnd * 0.45)).r
                  + texture2D(uI, vec2(su.x, bnd * 0.72)).r
                  + texture2D(uI, vec2(fract(su.x + 0.013), bnd * 0.58)).r) / 3.0;
      terr *= mix(1.0, 1.22 - 0.48 * veil, (1.0 - w) * 0.62);

      vec3 scene = mix(terr, cloud, w);

      // 帐篷灯：跟着风呼吸
      vec2 dq = (tuv - uTent) * vec2(uAsp, 1.0);
      float lamp = exp(-dot(dq, dq) * 260.0);
      scene += vec3(1.00, 0.62, 0.26) * lamp * (0.55 + 0.45 * sin(uT * 1.05)) * 0.34 * uOn;

      // 桌面：暗、有一束斜光；照片压出一道偏右下的接触影
      vec3 desk = mix(vec3(0.030, 0.034, 0.041), vec3(0.086, 0.094, 0.110),
                      clamp(1.0 - length(v - vec2(0.60, 0.40)) * 1.05, 0.0, 1.0));
      vec2 shAq = abs(pv - 0.5 - vec2(0.016, -0.030));
      float shM = max(shAq.x / (0.5 + bX), shAq.y / (0.5 + bY));
      desk *= 1.0 - 0.62 * (1.0 - inPrint) * exp(-max(0.0, shM - 1.0) * 6.5);

      vec3 c = desk;
      c = mix(c, vec3(0.80, 0.79, 0.76) * 0.86, inPrint);   // 相纸白边
      c = mix(c, scene, inPhoto);                            // 照片本身

      float g = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
      c += (g - 0.5) * 0.030;
      gl_FragColor = vec4(c, 1.0);
    }`;

  const sh = (t, s) => {
    const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
    const lg = gl.getShaderInfoLog(o);
    if (lg) console.error('shader ' + (t === gl.VERTEX_SHADER ? 'VS' : 'FS') + ': ' + lg);
    return o;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const MAXT = gl.getParameter(gl.MAX_TEXTURE_SIZE) || 4096;
  const tex = (src, done) => {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    const im = new Image();
    im.onload = () => {
      let el = im, nw = im.naturalWidth, nh = im.naturalHeight;
      const big = Math.max(nw, nh);
      if (big > MAXT - 8) {                       // 弱显卡上限只有 4096，缩到能用的尺寸
        const s = (MAXT - 8) / big;
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(nw * s)); c.height = Math.max(1, Math.round(nh * s));
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        el = c; nw = c.width; nh = c.height;
      }
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, el);
      done({ naturalWidth: nw, naturalHeight: nh });
    };
    im.src = src;
    return t;
  };

  let iw = 3840, ih = 1626, dw = 0, dh = 0;
  let base = null, depth = null, edge = null, pair = '', fx = 0.60, fy = 0.42;
  const U = (n) => gl.getUniformLocation(prog, n);
  const uI = U('uI'), uD = U('uD'), uE = U('uE'), uSh = U('uSh'), uZ = U('uZ'),
        uOff = U('uOff'), uTent = U('uTent'), uAsp = U('uAsp'), uAspS = U('uAspS'),
        uT = U('uT'), uOn = U('uOn'), uDrift = U('uDrift'), uHalf = U('uHalf'),
        uPc = U('uPc'), uRot = U('uRot');
  gl.uniform1i(uI, 0); gl.uniform1i(uD, 1); gl.uniform1i(uE, 2);

  // 漂移量写成 t 的闭式函数（不是逐帧累加），所以 ?t= 能定帧复现同一张云——
  // 这是上一版验运动的手段，回到单图后重新可用，不需要给页面留任何测试机器。
  const cloudX = (t) => 0.016 * t + 0.004 * Math.sin(0.19 * t) + 0.0016 * Math.sin(0.47 * t);

  function setPair() {
    const want = (innerWidth / innerHeight) < 1.05 ? 'tall' : 'wide';
    if (want === pair) return;
    pair = want;
    const s = SRC[want];
    fx = s[3]; fy = s[4];
    depth = tex(s[1], (im) => { dw = im.naturalWidth; dh = im.naturalHeight; });
    edge = tex(s[2], () => {});
    base = tex(s[0], (im) => { iw = im.naturalWidth; ih = im.naturalHeight; });
  }
  setPair();

  let px = 0, py = 0, tx = 0, ty = 0;
  addEventListener('pointermove', (e) => {
    tx = (e.clientX / innerWidth - 0.5) * 2;
    ty = (e.clientY / innerHeight - 0.5) * 2;
  }, { passive: true });

  const resize = () => {
    const dpr = Math.min(devicePixelRatio || 1, 1.75);
    cv.width = Math.round(innerWidth * dpr);
    cv.height = Math.round(innerHeight * dpr);
    gl.viewport(0, 0, cv.width, cv.height);
  };
  addEventListener('resize', () => { resize(); setPair(); });
  resize();

  const Q = new URLSearchParams(location.search);
  const tPin = Q.get('t') !== null ? Math.max(0, Number(Q.get('t'))) : null;

  function frame() {
    requestAnimationFrame(frame);
    px += (tx - px) * 0.06;
    py += (ty - py) * 0.06;

    const rect = stage.getBoundingClientRect();
    const testP = Q.get('p');
    const p = testP !== null ? Math.min(1, Math.max(0, Number(testP)))
                             : Math.min(1, Math.max(0, -rect.top / Math.max(rect.height, 1)));
    const t = tPin !== null ? tPin : performance.now() / 1000;

    // 前两成滚动是"穿过相纸"，穿过去之后才开始往山脊上走。
    // 穿过之前深度视差和云的漂移都归零——桌上的一张印刷品本来就是死的，
    // 它在你跨过去那一刻才活过来，这才是"平面变立体"那个动作本身。
    const CROSS = 0.42;
    let flat = 1 - Math.min(1, Math.max(0, p / CROSS));
    flat = flat * flat * (3 - 2 * flat);
    const walk = Math.max(0, (p - CROSS) / (1 - CROSS));
    const alive = 1 - flat;

    const zoom = 1.05 + Math.pow(walk, 1.12) * 0.57;
    const sh = (1 + walk * 1.5) * alive;
    const sx = 0.017 * px * sh;
    const sy = 0.011 * py * sh;

    const lim = (zoom - 1) / (2 * zoom);
    const clampOff = (o) => Math.max(-lim, Math.min(lim, o));
    const off = [clampOff(fx - 0.5 + walk * 0.055),      // 侧移：贴着脊走向帐篷
                 clampOff(0.5 - fy + walk * 0.100)];     // 地平线下沉

    // 相纸故意出右边框：一来给"更大的世界"留口气，二来避开左侧文案（等比放大会压到字上）
    const half = 1.22 + (0.360 - 1.22) * flat;           // 内图半宽（屏幕宽为单位）
    const pcx = 0.5 + 0.200 * flat + 0.0022 * flat * Math.sin(t * 0.21);
    const pcy = 0.475 + 0.030 * flat + 0.0030 * flat * Math.sin(t * 0.17 + 1.1);
    const rot = -0.017 * flat + 0.0016 * flat * Math.sin(t * 0.13);

    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, base);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, depth);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, edge);
    gl.uniform1f(uZ, zoom);
    gl.uniform1f(uAspS, cv.width / cv.height);
    gl.uniform2f(uSh, sx, sy);
    gl.uniform2f(uOff, off[0], off[1]);
    gl.uniform2f(uTent, TENT[pair][0], TENT[pair][1]);
    gl.uniform2f(uPc, pcx, pcy);
    gl.uniform1f(uHalf, half);
    gl.uniform1f(uRot, rot);
    gl.uniform1f(uAsp, iw / ih);
    gl.uniform1f(uT, t % 24);
    gl.uniform1f(uDrift, (cloudX(t) * alive + 0.06 * walk) % 1);
    gl.uniform1f(uOn, reduced ? 0 : 0.9 + 0.9 * walk);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    if (dw) stage.dataset.gl = 'on';
  }
  frame();

  const btn = document.getElementById('snd');
  let ac = null, gain = null;
  const build = () => {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const len = ac.sampleRate * 3;
    const b = ac.createBuffer(1, len, ac.sampleRate);
    const ch = b.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource();
    src.buffer = b; src.loop = true;

    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 620; bp.Q.value = 0.6;

    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1400;

    gain = ac.createGain(); gain.gain.value = 0;

    const lfo = ac.createOscillator(); lfo.frequency.value = 0.07;
    const lfoAmt = ac.createGain(); lfoAmt.gain.value = 0.018;
    lfo.connect(lfoAmt).connect(gain.gain);

    const drift = ac.createOscillator(); drift.frequency.value = 0.045;
    const driftAmt = ac.createGain(); driftAmt.gain.value = 260;
    drift.connect(driftAmt).connect(bp.frequency);

    src.connect(bp).connect(lp).connect(gain).connect(ac.destination);
    src.start(); lfo.start(); drift.start();
  };

  btn.addEventListener('click', () => {
    if (!ac) build();
    ac.resume();
    const on = btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', String(on));
    btn.textContent = on ? '声 · 开' : '声 · 关';
    gain.gain.setTargetAtTime(on ? 0.022 : 0, ac.currentTime, 0.4);
  });
})();
</script>
</body>
</html>
